name: CI/CD

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege by default; individual jobs elevate only what they need.
permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cicd-platform-demo-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cicd-platform-demo-frontend

jobs:
  # ---------------------------------------------------------------------
  # 1. Lint
  # ---------------------------------------------------------------------
  lint:
    name: Lint (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.workspace }}
        run: npm ci

      - name: Run ESLint
        working-directory: ${{ matrix.workspace }}
        run: npm run lint

      - name: Check formatting
        working-directory: ${{ matrix.workspace }}
        run: npm run format:check

  # ---------------------------------------------------------------------
  # 2. Type checking
  # ---------------------------------------------------------------------
  typecheck:
    name: Type check (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.workspace }}
        run: npm ci

      - name: Generate Prisma client
        if: matrix.workspace == 'backend'
        working-directory: backend
        run: npx prisma generate

      - name: Run tsc
        working-directory: ${{ matrix.workspace }}
        run: npm run typecheck

  # ---------------------------------------------------------------------
  # 3. Automated tests
  # ---------------------------------------------------------------------
  test-backend:
    name: Test (backend)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cicd_platform_demo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cicd_platform_demo_test?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Apply database migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Run tests with coverage
        working-directory: backend
        run: npm run test:coverage

  test-frontend:
    name: Test (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

  # ---------------------------------------------------------------------
  # 4. Application build
  # ---------------------------------------------------------------------
  build:
    name: Build (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    strategy:
      matrix:
        workspace: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.workspace }}
        run: npm ci

      - name: Generate Prisma client
        if: matrix.workspace == 'backend'
        working-directory: backend
        run: npx prisma generate

      - name: Build
        working-directory: ${{ matrix.workspace }}
        run: npm run build

  # ---------------------------------------------------------------------
  # 5. Dependency vulnerability scanning
  # ---------------------------------------------------------------------
  dependency-audit:
    name: Dependency audit (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.workspace }}
        run: npm ci

      - name: npm audit (fail on high/critical)
        working-directory: ${{ matrix.workspace }}
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------
  # 6. Secret scanning
  # ---------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------
  # 7 & 8. Build Docker images and scan them with Trivy
  # ---------------------------------------------------------------------
  docker-build-scan:
    name: Docker build & scan (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, build, dependency-audit, secret-scan]
    permissions:
      contents: read
      security-events: write
    strategy:
      # Both images' scans should run and report to the Security tab
      # independently - one failing shouldn't hide whether the other passed.
      fail-fast: false
      matrix:
        include:
          - workspace: backend
            dockerfile: backend/Dockerfile
            image: cicd-platform-demo-backend
          - workspace: frontend
            dockerfile: frontend/Dockerfile
            image: cicd-platform-demo-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.image }}:scan
          cache-from: type=gha,scope=${{ matrix.workspace }}
          cache-to: type=gha,mode=max,scope=${{ matrix.workspace }}

      - name: Generate Trivy SARIF report
        # Pinned to a commit SHA (not just a tag) since this action has
        # security-events: write access to the Security tab - verified
        # against the official v0.36.0 release tag:
        # https://github.com/aquasecurity/trivy-action/releases/tag/v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:scan
          format: sarif
          output: trivy-${{ matrix.workspace }}.sarif
          ignore-unfixed: true
          # SARIF includes all severities; enforce the threshold separately.
          exit-code: "0"

      - name: Enforce high and critical container vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.workspace }}.sarif
          category: trivy-${{ matrix.workspace }}

  # ---------------------------------------------------------------------
  # 9. Push Docker images (main branch only)
  # ---------------------------------------------------------------------
  push-images:
    name: Push images (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker-build-scan]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - workspace: backend
            dockerfile: backend/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/cicd-platform-demo-backend
          - workspace: frontend
            dockerfile: frontend/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/cicd-platform-demo-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.workspace }}
          cache-to: type=gha,mode=max,scope=${{ matrix.workspace }}

  # ---------------------------------------------------------------------
  # 10. Deploy to the EC2 host (main branch only)
  # ---------------------------------------------------------------------
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [push-images]
    environment:
      name: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::881893826765:role/cicd-platform-demo-github-actions-role
          aws-region: us-east-1

      - name: Deploy to EC2 via Systems Manager
        env:
          EC2_INSTANCE_ID: i-0e3e99eb06727e49b
          COMPOSE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docker-compose.prod.yml
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
        run: |
          set -euo pipefail

          REMOTE_SCRIPT=$(cat <<EOF
          set -euo pipefail
          cd /opt/cicd-platform-demo

          curl -fsSL "$COMPOSE_URL" -o docker-compose.prod.yml

          export BACKEND_IMAGE="$BACKEND_IMAGE"
          export FRONTEND_IMAGE="$FRONTEND_IMAGE"

          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f
          EOF
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ github.sha }}" \
            --parameters "$(jq -n --arg commands "$REMOTE_SCRIPT" '{commands: [$commands]}')" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command: $COMMAND_ID"

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text)

            echo "SSM status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed."
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardErrorContent' \
                  --output text
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for SSM command."
          exit 1
