name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege by default; individual jobs elevate only what they need.
permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cicd-platform-demo-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cicd-platform-demo-frontend

jobs:
  # ---------------------------------------------------------------------
  # 1. Lint
  # ---------------------------------------------------------------------
  lint:
    name: Lint (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.workspace }}
        run: npm ci

      - name: Run ESLint
        working-directory: ${{ matrix.workspace }}
        run: npm run lint

      - name: Check formatting
        working-directory: ${{ matrix.workspace }}
        run: npm run format:check

  # ---------------------------------------------------------------------
  # 2. Type checking
  # ---------------------------------------------------------------------
  typecheck:
    name: Type check (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.workspace }}
        run: npm ci

      - name: Generate Prisma client
        if: matrix.workspace == 'backend'
        working-directory: backend
        run: npx prisma generate

      - name: Run tsc
        working-directory: ${{ matrix.workspace }}
        run: npm run typecheck

  # ---------------------------------------------------------------------
  # 3. Automated tests
  # ---------------------------------------------------------------------
  test-backend:
    name: Test (backend)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cicd_platform_demo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cicd_platform_demo_test?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Apply database migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Run tests with coverage
        working-directory: backend
        run: npm run test:coverage

  test-frontend:
    name: Test (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

  # ---------------------------------------------------------------------
  # 4. Application build
  # ---------------------------------------------------------------------
  build:
    name: Build (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    strategy:
      matrix:
        workspace: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.workspace }}
        run: npm ci

      - name: Generate Prisma client
        if: matrix.workspace == 'backend'
        working-directory: backend
        run: npx prisma generate

      - name: Build
        working-directory: ${{ matrix.workspace }}
        run: npm run build

  # ---------------------------------------------------------------------
  # 5. Dependency vulnerability scanning
  # ---------------------------------------------------------------------
  dependency-audit:
    name: Dependency audit (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.workspace }}
        run: npm ci

      - name: npm audit (fail on high/critical)
        working-directory: ${{ matrix.workspace }}
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------
  # 6. Secret scanning
  # ---------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------
  # 7 & 8. Build Docker images and scan them with Trivy
  # ---------------------------------------------------------------------
  docker-build-scan:
    name: Docker build & scan (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, build, dependency-audit, secret-scan]
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        include:
          - workspace: backend
            dockerfile: backend/Dockerfile
            image: cicd-platform-demo-backend
          - workspace: frontend
            dockerfile: frontend/Dockerfile
            image: cicd-platform-demo-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.image }}:scan
          cache-from: type=gha,scope=${{ matrix.workspace }}
          cache-to: type=gha,mode=max,scope=${{ matrix.workspace }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ matrix.image }}:scan
          format: sarif
          output: trivy-${{ matrix.workspace }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.workspace }}.sarif
          category: trivy-${{ matrix.workspace }}

  # ---------------------------------------------------------------------
  # 9. Push Docker images (main branch only)
  # ---------------------------------------------------------------------
  push-images:
    name: Push images (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker-build-scan]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - workspace: backend
            dockerfile: backend/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/cicd-platform-demo-backend
          - workspace: frontend
            dockerfile: frontend/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/cicd-platform-demo-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.workspace }}
          cache-to: type=gha,mode=max,scope=${{ matrix.workspace }}

  # ---------------------------------------------------------------------
  # 10. Deploy to the EC2 host (main branch only)
  # ---------------------------------------------------------------------
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [push-images]
    environment:
      name: production
    # No GITHUB_TOKEN use in this job (see the "No `docker login`" note
    # below), so it needs nothing beyond the default read access to check
    # out docker-compose.prod.yml.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # docker-compose.prod.yml is versioned in git, not hand-edited on the
      # host, so every deploy ships the exact file that matches this commit.
      - name: Copy docker-compose.prod.yml to the host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: docker-compose.prod.yml
          target: /opt/cicd-platform-demo
          strip_components: 0

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          # BACKEND_IMAGE/FRONTEND_IMAGE are pinned to this commit's SHA so
          # the host always runs the exact image built and scanned above -
          # never a mutable `latest` that could drift from what was tested.
          # POSTGRES_PASSWORD/CORS_ORIGIN etc. come from a `.env` file that
          # must already exist in /opt/cicd-platform-demo on the host (see
          # docs/deployment.md) - it is deliberately not managed by CI.
          #
          # No `docker login` here, deliberately: the GHCR packages this
          # pipeline pushes to are public (same content as this public repo -
          # nothing is disclosed by the image that isn't already visible in
          # source), so pulling is anonymous. No GHCR credential of any kind
          # is ever written to this host. See docs/deployment.md for the
          # one-time package-visibility step and the private-registry
          # alternative if you fork this for a closed-source project.
          script: |
            set -e
            cd /opt/cicd-platform-demo
            export BACKEND_IMAGE="${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
            export FRONTEND_IMAGE="${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
